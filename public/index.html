<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EchoSphere AI</title>

    <link rel="stylesheet" href="styles.css">
    <script>
        function logErr(msg, url, line, col, error) {
            fetch('/log', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    type: 'error',
                    message: msg,
                    url: url,
                    line: line,
                    col: col,
                    stack: error ? error.stack : null
                })
            }).catch(e => {});
        }
        window.onerror = logErr;
        window.onunhandledrejection = function(event) {
            fetch('/log', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    type: 'unhandledrejection',
                    reason: event.reason ? (event.reason.message || String(event.reason)) : null,
                    stack: event.reason ? event.reason.stack : null
                })
            }).catch(e => {});
        };
    </script>
</head>

<body>
    <div id="world-container" aria-hidden="true"></div>

    <!-- ======================================================
         APPLICATION CONTAINER
    ======================================================= -->

    <main class="app">

        <!-- ==================================================
             JOIN SCREEN
        =================================================== -->

        <section id="join-screen">

            <h1>EchoSphere AI</h1>

            <p>
                Browser-based Spatial Voice Chat
            </p>

            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input id="username" type="text" placeholder="Enter your name">

            </div>

            <div class="input-group">

                <label for="room-id">
                    Room ID
                </label>

                <input id="room-id" type="text" placeholder="e.g. team-meeting">

            </div>

            <button id="join-btn">
                Join Room
            </button>

        </section>


        <!-- ==================================================
             ROOM SCREEN
        =================================================== -->

        <section id="room-screen" hidden>

            <header>

                <h2>EchoSphere AI</h2>

                <p>
                    Room:
                    <span id="current-room">
                        -
                    </span>
                </p>

            </header>


            <!-- Connection Status -->

            <section class="card">

                <h3>Status</h3>

                <p id="connection-status">
                    Connecting...
                </p>

            </section>


            <!-- Participants -->

            <section class="card">

                <h3>Participants</h3>

                <ul id="participants-list">

                </ul>

            </section>


            <!-- Controls -->

            <section class="card">

                <h3>Controls</h3>

                <button id="mute-btn">

                    Mute

                </button>

                <button id="spatial-btn" type="button">
                    Spatial Audio: Off
                </button>

                <button id="leave-btn">

                    Leave Room

                </button>

            </section>

        </section>

    </main>


    <!-- Socket.IO -->

    <script src="/socket.io/socket.io.js"></script>

    <!-- Application core (defines window.startApp, window.leaveRoom) -->

    <script type="module" src="app.js"></script>

    <!-- UI controller (calls window.startApp on join) -->

    <script src="ui.js"></script>

    <!-- Position synchronization -->

    <script type="module" src="network/positionSync.js"></script>

</body>

</html>
